<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact - 72 Degrees East Inc</title>
  <meta name="description" content="Contact 72 Degrees East Inc for distribution, sourcing, quality control, packing, and data entry support." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-base="" data-page="contact">
  <div id="site-header"></div>

  <main>
    <section class="section page-hero">
      <p class="breadcrumb"><a href="index.html">Home</a> / Contact</p>
      <p class="eyebrow">Get in touch with us!</p>
      <h1>Contact Us</h1>
      <p class="lead">Share your sourcing, distribution, quality, or operations requirements. Our team will get back to you quickly.</p>
    </section>

    <section class="section contact">
      <div class="contact-grid">
        <div>
          <h2>Business Contact</h2>
          <ul class="contact-list">
            <li><strong>Phone:</strong> <a href="tel:+16094360132">+1 609 436 0132</a></li>
            <li><strong>Address:</strong> 1800 E State St Suite 167A</li>
            <li><strong>Website:</strong> <a href="https://72degreeseast.com/" target="_blank" rel="noreferrer">72degreeseast.com</a></li>
          </ul>
        </div>
        <form class="form" action="#" method="post">
          <label for="name">Name</label>
          <input id="name" name="name" type="text" placeholder="Your full name" required />

          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="you@company.com" required />

          <label for="message">Message</label>
          <textarea id="message" name="message" placeholder="Tell us what you need." required></textarea>

          <button class="btn btn-primary" type="submit">Submit</button>
          <p id="form-status" aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="partials.js"></script>
  <script src="main.js"></script>
</body>
</html>
